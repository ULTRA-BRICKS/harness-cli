[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-cli"
version = "0.6.0"
description = "Real rate-limit proximity (percent used, reset, pace) for Claude Code, Codex, z.ai, x.ai, and kimi accounts on this machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["cli", "claude-code", "rate-limit", "usage", "agent-tools"]

# Zero required runtime deps: stdlib urllib + json. Usage percents come from each
# provider's usage API; missing creds/endpoints fail closed rather than guessing.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
harness = "harness_cli.cli:main"

# No [project.urls] Homepage yet - this repo has no GitHub remote (see README.md's
# "Status" section); add it once one exists rather than shipping a dangling link.

[tool.setuptools.packages.find]
include = ["harness_cli*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
