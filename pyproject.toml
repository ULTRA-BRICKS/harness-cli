[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-cli"
version = "0.2.0"
description = "Observed token/message/api-error signals from local agent harness transcripts (starting with Claude Code), so other tools (review-cli, tg-cli, pm-cli) can pace concurrency instead of guessing blind."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Mextner" }]
keywords = ["cli", "claude-code", "rate-limit", "usage", "agent-tools"]

# Zero required runtime deps: reads local JSONL with stdlib json, discovers files with
# stdlib pathlib. No API key, no network call, matching how Claude Code's own transcripts
# are already stored on disk.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
harness = "harness_cli.cli:main"

# No [project.urls] Homepage yet - this repo has no GitHub remote (see README.md's
# "Status" section); add it once one exists rather than shipping a dangling link.

[tool.setuptools.packages.find]
include = ["harness_cli*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
